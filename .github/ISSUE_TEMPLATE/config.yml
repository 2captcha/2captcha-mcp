blank_issues_enabled: true
contact_links:
  - name: Problem with a tool's RESULT (scrape, parse, CAPTCHA, billing)
    url: https://2captcha.com/support
    about: >
      Those come from the hosted service, not from this package. Support has
      the request logs; this tracker does not.
  - name: Security vulnerability
    url: https://github.com/2captcha/2captcha-mcp/security/advisories/new
    about: Report privately as a draft advisory — please do not open an issue.
  - name: API key and account
    url: https://2captcha.com/setting
    about: Where your API_TOKEN lives, and where to rotate it.
