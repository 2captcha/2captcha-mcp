name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # ci, not install: `npm install` rewrites package-lock.json in place,
      # which is how the lock drifted away from package.json unnoticed.
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint

  # The published artifact is the bundle, not server.js, so a green test suite
  # against the source proves less than it looks. Build it and run the thing
  # that actually ships.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: The bundle starts and reports its version
        run: |
          VERSION="$(node 2captcha-mcp.mjs --version)"
          PKG="$(npm pkg get version | tr -d '"')"
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::bundle reports $VERSION, package.json says $PKG"
            exit 1
          fi
          node 2captcha-mcp.mjs --help > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and run it as the non-root user it ships with
        run: |
          docker build -t 2captcha-mcp:ci .
          test "$(docker run --rm 2captcha-mcp:ci --version)" = "$(npm pkg get version | tr -d '"')"
          test "$(docker run --rm --entrypoint id 2captcha-mcp:ci -un)" = "node"

  # The registry's full JSON Schema, checked on every PR rather than first at
  # release time, when a rejection means npm already has the version.
  registry-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mcp-publisher
      - run: mcp-publisher validate server.json
