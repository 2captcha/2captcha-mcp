name: Release

# Tags only. This used to run on every push and filter the tag inside the job,
# which meant a red X on ordinary commits for a workflow that had correctly
# decided to do nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release and upload the .mcpb bundle
  id-token: write   # OIDC, for npm provenance
  packages: write   # push the container image to GHCR

jobs:
  release:
    name: Publish to npm, GitHub Releases and GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify NPM_TOKEN secret is present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set for this repository."
            echo "Add it at Settings > Secrets and variables > Actions > Repository secrets."
            echo "It must be a *secret* named exactly NPM_TOKEN (not a Variable, not an Environment secret)."
            exit 1
          fi
          echo "NPM_TOKEN is present (length: ${#NODE_AUTH_TOKEN})."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # The tag is checked against package.json, and package.json against the
      # other three files that carry the version. Before this, a stale
      # package-lock.json passed the only gate there was.
      - name: Check the tag and all four version files agree
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(npm pkg get version | tr -d '"')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          npm run version:check

      - name: Run tests
        run: npm test

      - name: Set up mcp-publisher
        uses: ./.github/actions/setup-mcp-publisher

      # Catches the constraints the local tests cannot see — the registry's
      # JSON Schema, in full — before anything is published anywhere. The
      # registry publish itself is the mcp-registry job below, after npm.
      - name: Validate server.json against the registry schema
        run: mcp-publisher validate server.json

      # Provenance links the tarball to this workflow run and this commit, and
      # npm renders it as a "Built and signed" badge on the package page. It is
      # the machine-checkable answer to the unaffiliated `2captcha-mcp`
      # package, which cannot produce one.
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # `npm publish` above ran prepack, so the bundle already exists; build
      # again anyway so this step does not depend on that side effect.
      - name: Build the .mcpb bundle
        run: |
          npm run build
          npm run bundle

      - name: Create the GitHub Release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.mcpb \
          || gh release upload "$TAG" dist/*.mcpb --clobber

      # The Dockerfile has existed since the first release and the image was
      # never published anywhere, so the only way to get one was to build it
      # yourself from a clone.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

  # Separate job so the DNS signing key lives on the `mcp-registry`
  # environment and is never in scope for npm ci / build. It needs the npm
  # release (the registry checks the package's mcpName); if anything after npm
  # fails, re-run it alone from Actions → MCP Registry on the tag.
  mcp-registry:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
