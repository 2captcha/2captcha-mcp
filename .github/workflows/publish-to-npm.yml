name: Publish to npm

on: push

jobs:
  build-and-publish:
    name: Build and publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify NPM_TOKEN secret is present
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set for this repository."
            echo "Add it at Settings > Secrets and variables > Actions > Repository secrets."
            echo "It must be a *secret* named exactly NPM_TOKEN (not a Variable, not an Environment secret)."
            exit 1
          fi
          echo "NPM_TOKEN is present (length: ${#NODE_AUTH_TOKEN})."

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(npm pkg get version | tr -d '\"')"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
